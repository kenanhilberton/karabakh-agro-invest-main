version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: karabakh-postgres
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-changeme}
      POSTGRES_DB: ${PGDATABASE:-karabakh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-karabakh}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karabakh-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karabakh-api
    environment:
      NODE_ENV: production
      PORT: 4000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-changeme}
      PGDATABASE: ${PGDATABASE:-karabakh}
      JWT_SECRET: ${JWT_SECRET:-supersecret_change_in_production}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - karabakh-network
    restart: unless-stopped

networks:
  karabakh-network:
    driver: bridge

volumes:
  postgres_data: