name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # CI-də real PostgreSQL lazım deyil — pg-mem (in-memory) rejimi istifadə olunur.
      PG_MODE: memory
      JWT_SECRET: ci-test-secret-change-me
      PORT: '4000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server

      - name: Build client
        run: npm run build --prefix client

      - name: Syntax check (server + Vercel function)
        run: |
          node --check server/src/index.js
          node --check "api/[...path].js"

      - name: Unit tests
        working-directory: ./server
        run: node --test

      - name: Smoke test API (memory DB)
        run: |
          npm start --prefix server &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health > /dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- health ---"
          curl -fsS http://localhost:4000/api/health
          echo ""
          echo "--- lands ---"
          curl -fsS http://localhost:4000/api/v1/lands > /dev/null && echo "ok"
          echo "--- swagger page ---"
          curl -fsS http://localhost:4000/api-docs > /dev/null && echo "ok"
          echo "--- swagger asset (root-relative) ---"
          curl -fsS http://localhost:4000/swagger-ui.css > /dev/null && echo "ok"
          kill $SERVER_PID
